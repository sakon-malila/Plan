<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>เต้ยไปเรื่อย - นครนายก 3 วัน 2 คืน</title>
  
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0F2027 0%, #203A43 50%, #2C5364 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-hover: rgba(255, 255, 255, 0.15);
      
      --accent-green: #00E676;
      --accent-green-glow: rgba(0, 230, 118, 0.35);
      --accent-orange: #FF9100;
      --accent-blue: #00E5FF;
      
      --text-main: #FFFFFF;
      --text-sub: #B0BEC5;
      --text-muted: #78909C;
      
      --badge-fixed: #FF3D00;
      --radius: 16px;
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header Design */
    header {
      text-align: center;
      padding: 24px 16px 16px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #00E676, #00E5FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .brand-subtitle {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: 300;
    }

    /* Day Switcher Tabs */
    .day-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-weight: 500;
      font-size: 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .tab-btn span.day-num {
      font-weight: 700;
      font-size: 1rem;
    }

    .tab-btn.active {
      background: var(--accent-green);
      color: #002B11;
      box-shadow: 0 4px 15px var(--accent-green-glow);
    }

    /* Section Info */
    .day-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .day-title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-btn {
      background: rgba(0, 230, 118, 0.15);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .add-btn:hover {
      background: var(--accent-green);
      color: #000;
    }

    /* Itinerary List */
    .place-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .place-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
      position: relative;
    }

    .place-card.dragging {
      opacity: 0.4;
      border-color: var(--accent-green);
    }

    .place-card.is-locked {
      border-left: 4px solid var(--badge-fixed);
      background: rgba(255, 61, 0, 0.08);
    }

    .drag-handle {
      color: var(--text-muted);
      cursor: grab;
      padding: 4px;
      font-size: 1.1rem;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .place-time-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 75px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .time-start {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-green);
    }

    .time-end {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .place-info {
      flex: 1;
    }

    .place-name {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-lock {
      background: var(--badge-fixed);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .place-duration-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .dur-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dur-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .dur-text {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .place-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .action-btn.del:hover {
      background: #FF1744;
      color: #fff;
      border-color: #FF1744;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1E293B;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .modal-header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-green);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .modal-btn.cancel {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .modal-btn.save {
      background: var(--accent-green);
      color: #002B11;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand-title">
        <i class="fa-solid fa-compass"></i> เต้ยไปเรื่อย
      </div>
      <div class="brand-subtitle">จัดทริปเที่ยวนครนายก 3 วัน 2 คืน (คำนวณเวลาอัตโนมัติ)</div>
    </header>

    <!-- Day Navigation -->
    <div class="day-tabs">
      <button class="tab-btn active" onclick="switchDay(5)">
        <span class="day-num">วันที่ 5</span>
        <span style="font-size: 0.7rem;">(วันแรก)</span>
      </button>
      <button class="tab-btn" onclick="switchDay(6)">
        <span class="day-num">วันที่ 6</span>
        <span style="font-size: 0.7rem;">(ลุยกิจกรรม)</span>
      </button>
      <button class="tab-btn" onclick="switchDay(7)">
        <span class="day-num">วันที่ 7</span>
        <span style="font-size: 0.7rem;">(เดินทางกลับ)</span>
      </button>
    </div>

    <!-- Day Info & Actions -->
    <div class="day-summary">
      <div class="day-title" id="dayTitle">
        <i class="fa-regular fa-calendar-days" style="color: var(--accent-green);"></i> แผนการท่องเที่ยว
      </div>
      <button class="add-btn" onclick="openAddModal()">
        <i class="fa-solid fa-plus"></i> เพิ่มสถานที่
      </button>
    </div>

    <!-- List Container -->
    <div class="place-list" id="placeList"></div>

    <footer>
      ออกแบบสำหรับใช้งานใน Antigravity IDE & Mobiles | เต้ยไปเรื่อย © 2026
    </footer>
  </div>

  <!-- Add Location Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>เพิ่มจุดท่องเที่ยว/กิจกรรม</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeAddModal()"></i>
      </div>
      <div class="form-group">
        <label>ชื่อสถานที่ / กิจกรรม</label>
        <input type="text" id="newPlaceName" class="form-control" placeholder="เช่น ร้านกาแฟ, แวะกินข้าว" />
      </div>
      <div class="form-group">
        <label>ระยะเวลาที่ใช้ (นาที)</label>
        <input type="number" id="newPlaceDuration" class="form-control" value="30" step="5" />
      </div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeAddModal()">ยกเลิก</button>
        <button class="modal-btn save" onclick="saveNewPlace()">บันทึก</button>
      </div>
    </div>
  </div>

  <script>
    // Master Itinerary Data
    let currentDay = 5;

    const itineraryData = {
      5: {
        startTime: "07:30",
        places: [
          { id: "p1", name: "รับรถมอเตอร์ไซค์ หน้า รพ.นครนายก", duration: 30, isLocked: false },
          { id: "p2", name: "เดินทางไปฝากกระเป๋า ที่พักริมธารรีสอร์ท", duration: 30, isLocked: false },
          { id: "p3", name: "วัดจุฬาภรณ์วนาราม (ซุ้มป่าไผ่)", duration: 30, isLocked: false },
          { id: "p4", name: "สะพานทุ่งนามุ้ย", duration: 30, isLocked: false },
          { id: "p5", name: "แวะทานอาหารเที่ยง", duration: 30, isLocked: false },
          { id: "p6", name: "กลับเข้าเช็คอินที่พัก (ริมธารรีสอร์ท)", duration: 30, isLocked: true, lockTime: "14:00" },
          { id: "p7", name: "เที่ยวน้ำตกสาริกา", duration: 30, isLocked: false },
          { id: "p8", name: "เที่ยวอ่างเก็บน้ำห้วยปรือ", duration: 30, isLocked: false },
          { id: "p9", name: "ซื้อของตลาด / ทำกับข้าวสังสรรค์", duration: 60, isLocked: false }
        ]
      },
      6: {
        startTime: "08:30",
        places: [
          { id: "p10", name: "เที่ยวน้ำตกนางรอง", duration: 30, isLocked: false },
          { id: "p11", name: "เที่ยวเขื่อนขุนด่านปราการชล", duration: 30, isLocked: false },
          { id: "p12", name: "ทานอาหารเที่ยง", duration: 30, isLocked: false },
          { id: "p13", name: "ขับรถ ATV ลุยเส้นทางธรรมชาติ", duration: 60, isLocked: true, lockTime: "13:00" },
          { id: "p14", name: "ล่องแก่งแม่น้ำนครนายกแบบจ๊วดๆ", duration: 90, isLocked: true, lockTime: "14:30" },
          { id: "p15", name: "กลับที่พัก อาบน้ำเปลี่ยนชุด", duration: 30, isLocked: false },
          { id: "p16", name: "ซื้อของกินตลาด นั่งชิลจิบเบียร์", duration: 60, isLocked: false }
        ]
      },
      7: {
        startTime: "09:00",
        places: [
          { id: "p17", name: "เก็บของ เช็คเอาท์เตรียมตัวเดินทาง", duration: 30, isLocked: false },
          { id: "p18", name: "นำรถมอเตอร์ไซค์ไปคืนร้านเช่า", duration: 30, isLocked: false },
          { id: "p19", name: "นั่ง Grab ไป บขส. นครนายก", duration: 20, isLocked: false },
          { id: "p20", name: "นั่งรถตู้/มินิบัส ไปสถานีสระบุรี", duration: 90, isLocked: false },
          { id: "p21", name: "ขึ้นรถไฟสระบุรี เดินทางกลับศรีสะเกษ", duration: 30, isLocked: false }
        ]
      }
    };

    // Helper: Convert "HH:MM" to total minutes
    function timeToMinutes(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    // Helper: Convert total minutes to "HH:MM"
    function minutesToTime(totalMins) {
      const h = Math.floor(totalMins / 60) % 24;
      const m = totalMins % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    // Render Current Day Schedule
    function renderSchedule() {
      const dayData = itineraryData[currentDay];
      const container = document.getElementById('placeList');
      container.innerHTML = '';

      let currentMins = timeToMinutes(dayData.startTime);

      dayData.places.forEach((place, index) => {
        // If block has a fixed lock time, override running time
        if (place.isLocked && place.lockTime) {
          currentMins = timeToMinutes(place.lockTime);
        }

        const startTimeStr = minutesToTime(currentMins);
        const endMins = currentMins + place.duration;
        const endTimeStr = minutesToTime(endMins);

        const card = document.createElement('div');
        card.className = `place-card ${place.isLocked ? 'is-locked' : ''}`;
        card.draggable = true;
        card.dataset.index = index;

        card.innerHTML = `
          <div class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></div>
          <div class="place-time-badge">
            <span class="time-start">${startTimeStr}</span>
            <span class="time-end">${endTimeStr}</span>
          </div>
          <div class="place-info">
            <div class="place-name">
              ${place.name}
              ${place.isLocked ? `<span class="tag-lock"><i class="fa-solid fa-lock"></i> ล็อกเวลา</span>` : ''}
            </div>
            <div class="place-duration-controls">
              <button class="dur-btn" onclick="updateDuration(${index}, -15)">-</button>
              <span class="dur-text">${place.duration} นาที</span>
              <button class="dur-btn" onclick="updateDuration(${index}, 15)">+</button>
            </div>
          </div>
          <div class="place-actions">
            <button class="action-btn" onclick="movePlace(${index}, -1)"><i class="fa-solid fa-chevron-up"></i></button>
            <button class="action-btn" onclick="movePlace(${index}, 1)"><i class="fa-solid fa-chevron-down"></i></button>
            ${!place.isLocked ? `<button class="action-btn del" onclick="deletePlace(${index})"><i class="fa-solid fa-trash"></i></button>` : ''}
          </div>
        `;

        // Attach Drag and Drop Events
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragover', handleDragOver);
        card.addEventListener('drop', handleDrop);
        card.addEventListener('dragend', handleDragEnd);

        container.appendChild(card);

        // Advance running clock
        currentMins = endMins;
      });
    }

    // Tab Switcher
    function switchDay(dayNum) {
      currentDay = dayNum;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', [5, 6, 7][idx] === dayNum);
      });
      document.getElementById('dayTitle').innerHTML = `<i class="fa-regular fa-calendar-days" style="color: var(--accent-green);"></i> แผนการท่องเที่ยว วันที่ ${dayNum}`;
      renderSchedule();
    }

    // Up/Down Move Buttons
    function movePlace(index, direction) {
      const places = itineraryData[currentDay].places;
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= places.length) return;

      const temp = places[index];
      places[index] = places[targetIndex];
      places[targetIndex] = temp;

      renderSchedule();
    }

    // Adjust Duration
    function updateDuration(index, delta) {
      const place = itineraryData[currentDay].places[index];
      if (place.duration + delta >= 15) {
        place.duration += delta;
        renderSchedule();
      }
    }

    // Delete Item
    function deletePlace(index) {
      itineraryData[currentDay].places.splice(index, 1);
      renderSchedule();
    }

    // Drag & Drop Handling
    let dragSrcIndex = null;

    function handleDragStart(e) {
      dragSrcIndex = Number(this.dataset.index);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      if (e.preventDefault) e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      return false;
    }

    function handleDrop(e) {
      if (e.stopPropagation) e.stopPropagation();
      const dropIndex = Number(this.dataset.index);
      if (dragSrcIndex !== null && dragSrcIndex !== dropIndex) {
        const places = itineraryData[currentDay].places;
        const [draggedItem] = places.splice(dragSrcIndex, 1);
        places.splice(dropIndex, 0, draggedItem);
        renderSchedule();
      }
      return false;
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
    }

    // Modal Control
    function openAddModal() {
      document.getElementById('addModal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('newPlaceName').value = '';
    }

    function saveNewPlace() {
      const name = document.getElementById('newPlaceName').value.trim();
      const duration = parseInt(document.getElementById('newPlaceDuration').value) || 30;

      if (!name) return alert('กรุณากรอกชื่อสถานที่');

      itineraryData[currentDay].places.push({
        id: 'p_' + Date.now(),
        name: name,
        duration: duration,
        isLocked: false
      });

      closeAddModal();
      renderSchedule();
    }

    // Init App
    window.onload = function() {
      renderSchedule();
    };
  </script>
</body>
</html>
